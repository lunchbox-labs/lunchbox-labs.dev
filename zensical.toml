[project]
site_name = "Lunchbox Labs"
site_description = "Developer tools, packages and apps from Lunchbox Labs."
site_url = "https://lunchbox-labs.dev/"
docs_dir = "docs"
site_dir = "site"
nav = [
  "index.md",
]

[project.theme]
font = false

# The first palette follows the system appearance. The header toggle cycles
# system -> light -> dark and remembers the choice in the browser.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to Light Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to Dark Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to System Preference"
