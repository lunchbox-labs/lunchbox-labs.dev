[project]
site_name = "Lunchbox Labs"
site_description = "Developer tools, packages and apps from Lunchbox Labs."
site_url = "https://lunchbox-labs.dev/"
copyright = "Copyright &copy; 2026 Lunchbox Labs"
docs_dir = "docs"
site_dir = "site"
nav = [
  "index.md",
]

# The site has a single page, so a search box and index add nothing.
[project.plugins.search]
enabled = false

[project.theme]
font = false
features = ["content.code.copy"]

# The first palette follows the system appearance. The header toggle cycles
# system -> light -> dark and remembers the choice in the browser.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to Light Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to Dark Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to System Preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lunchbox-labs"
name = "Lunchbox Labs on GitHub"
